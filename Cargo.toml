[package]
name = "plain-lang"
version = "0.1.0"
edition = "2021"
description = "A tiny English-like programming language, interpreted in Rust"

[lib]
name = "plain_lang"
path = "src/lib.rs"

[[bin]]
name = "plain"
path = "src/main.rs"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
